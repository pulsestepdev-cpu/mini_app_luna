server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml font/ttf;
    gzip_min_length 1024;

    # index.html никогда не кешируем — иначе после обновления Telegram покажет старую версию
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Файлы сборки с хешем в имени — кешируем навсегда
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "public, max-age=86400";
        try_files $uri $uri/ /index.html;
    }
}
